<p>在年老的人看来，青春美妙，我们可以做许多白日梦，可以失败，可以哭泣，光芒万丈。但是，年轻如我们却不知其中的美好，总是在无病强说愁，或者颓废消极地殒磨青春……只有待到青春不再，方知其中的可贵。
—— 萨特</p>
