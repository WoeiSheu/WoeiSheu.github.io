(() => {
  const key = "kino-reading-theme";
  const system = matchMedia("(prefers-color-scheme: dark)");
  let preference = "system";
  try {
    const saved = localStorage.getItem(key);
    if (["light", "dark"].includes(saved)) preference = saved;
  } catch {}
  const apply = (doc = document) => {
    const theme =
      preference === "system"
        ? system.matches
          ? "dark"
          : "light"
        : preference;
    doc.documentElement.dataset.theme = theme;
    doc.documentElement.style.colorScheme = theme;
    doc
      .querySelector('meta[name="theme-color"]')
      ?.setAttribute("content", theme === "dark" ? "#171d1a" : "#f4f5f2");
    doc.querySelectorAll("[data-theme-control]").forEach((control) => {
      control.value = preference;
    });
  };
  apply();
  if (window.__kinoTheme) return;
  window.__kinoTheme = true;
  document.addEventListener("change", (event) => {
    if (!event.target.matches("[data-theme-control]")) return;
    preference = event.target.value;
    try {
      localStorage.setItem(key, preference);
    } catch {}
    apply();
  });
  system.addEventListener("change", () => {
    if (preference === "system") apply();
  });
  window.addEventListener("storage", (event) => {
    if (event.key !== key) return;
    preference = ["light", "dark"].includes(event.newValue)
      ? event.newValue
      : "system";
    apply();
  });
  document.addEventListener("astro:before-swap", (event) =>
    apply(event.newDocument),
  );
  document.addEventListener("astro:page-load", () => apply());
})();
